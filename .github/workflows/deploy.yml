# Zet ontbindenbv-nl op Cloudflare vanaf GitHub, zonder laptop (zoals belastingbemiddelaar-nl).
#
# Wanneer: bij elke push naar main (dus bij elke gemergde PR), of met de knop
# Actions > "Deploy naar Cloudflare" > Run workflow.
#
# Nodig (eenmalig): repository secret CLOUDFLARE_API_TOKEN (Settings > Secrets and variables > Actions), met rechten
# Workers Scripts, D1 en Queues (bewerken). Zonder die secret slaat de workflow de deploy over (geen rode build).
# Het account-ID hieronder is geen geheim.
#
# Zolang wrangler.jsonc geen routes heeft, komt de site alleen op het test-adres op workers.dev (noindex, robots Disallow).
# Wat het doet: `pnpm run deploy`, zoals op de Mac, maar vanaf een schone checkout van main.
name: Deploy naar Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# nooit twee deploys tegelijk; een tweede wacht tot de eerste klaar is (en wordt niet afgebroken)
concurrency:
  group: deploy-ontbindenbv-nl
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 61bfeae4f0fd91877bb25720cea14e14

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Token aanwezig?
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Repository secret CLOUDFLARE_API_TOKEN ontbreekt, deploy overgeslagen."
            echo "ok=nee" >> "$GITHUB_OUTPUT"
          else
            echo "ok=ja" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.token.outputs.ok == 'ja'
        with:
          fetch-depth: 2 # voor de migratiecontrole

      # Een nieuwe D1-migratie moet op de database staan voordat de nieuwe code live gaat. Een automatische run stopt
      # daarom als de push een nieuw bestand in migrations/ bevat. Ga door met de knop Run workflow (die slaat deze
      # controle over) of zet "[migratie gedaan]" in de merge-commit.
      - name: Controle nieuwe migraties
        if: steps.token.outputs.ok == 'ja' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[migratie gedaan]')
        run: |
          base="${{ github.event.before }}"
          if ! git fetch -q --depth=1 origin "$base" 2>/dev/null; then base="HEAD~1"; fi
          nieuw=$(git diff --name-only --diff-filter=A "$base" HEAD -- migrations)
          if [ -n "$nieuw" ]; then
            echo "::error::Nieuwe migratie(s): $nieuw. Voer ze eerst uit op de database en start daarna Actions > Deploy naar Cloudflare > Run workflow."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        if: steps.token.outputs.ok == 'ja'
        with:
          version: 10

      - uses: actions/setup-node@v5
        if: steps.token.outputs.ok == 'ja'
        with:
          node-version: 22
          cache: pnpm

      - name: Installeren
        if: steps.token.outputs.ok == 'ja'
        run: pnpm install --frozen-lockfile

      # wrangler deploy faalt als de wachtrij uit wrangler.jsonc niet bestaat; eenmalig aanmaken
      - name: CRM-wachtrij
        if: steps.token.outputs.ok == 'ja'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler queues info ontbindenbv-crm >/dev/null 2>&1 || pnpm exec wrangler queues create ontbindenbv-crm

      - name: Bouwen en deployen
        if: steps.token.outputs.ok == 'ja'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run deploy
